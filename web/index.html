<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MREmu WebAssembly Emulator Interface</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.6);
    }
    canvas {
      border: 2px solid #333;
      background-color: #000;
      width: 240px;
      height: 320px;
      image-rendering: pixelated;
    }
    .status-bar {
      margin-top: 10px;
      font-size: 14px;
      color: #4caf50;
    }
    .file-drop-zone {
      margin-top: 15px;
      width: 240px;
      padding: 12px;
      border: 2px dashed #555;
      border-radius: 8px;
      background-color: #2a2a2a;
      text-align: center;
      font-size: 13px;
      cursor: pointer;
      box-sizing: border-box;
    }
    .file-drop-zone.hover {
      border-color: #4caf50;
      background-color: #333;
    }
    .file-input {
      display: none;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 15px;
      width: 240px;
    }
    .keypad button {
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    .keypad button:active {
      background-color: #555;
    }
    .config-panel {
      margin-top: 15px;
      width: 240px;
      font-size: 12px;
      background: #2a2a2a;
      padding: 10px;
      border-radius: 6px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <h1>MREmu WebAssembly Emulator</h1>
  <div class="container">
    <canvas id="canvas" width="240" height="320"></canvas>
    <div id="status" class="status-bar">Downloading WASM Module...</div>

    <div id="dropZone" class="file-drop-zone" onclick="document.getElementById('fileInput').click()">
      <strong>Select or Drag & Drop VXP / VRE File</strong>
      <br/><span style="font-size:11px; color:#aaa;">(.vxp, .vre, .mre)</span>
      <input type="file" id="fileInput" class="file-input" accept=".vxp,.vre,.mre" onchange="handleFileSelect(event)">
    </div>

    <div class="keypad">
      <button onmousedown="sendKey(1001,0)" onmouseup="sendKey(1001,1)">L-Soft</button>
      <button onmousedown="sendKey(1,0)" onmouseup="sendKey(1,1)">UP</button>
      <button onmousedown="sendKey(1002,0)" onmouseup="sendKey(1002,1)">R-Soft</button>
      <button onmousedown="sendKey(3,0)" onmouseup="sendKey(3,1)">LEFT</button>
      <button onmousedown="sendKey(5,0)" onmouseup="sendKey(5,1)">OK</button>
      <button onmousedown="sendKey(4,0)" onmouseup="sendKey(4,1)">RIGHT</button>
      <button onmousedown="sendKey(2,0)" onmouseup="sendKey(2,1)">DOWN</button>
      <button onmousedown="sendKey(48,0)" onmouseup="sendKey(48,1)">0</button>
      <button onmousedown="sendKey(49,0)" onmouseup="sendKey(49,1)">1</button>
    </div>

    <div class="config-panel">
      <strong>Key Mappings:</strong><br/>
      Arrows: D-Pad | Space/Enter: OK<br/>
      Q: Left Softkey | E: Right Softkey<br/>
      0-9: Numpad 0-9
    </div>
  </div>

  <script type="text/javascript">
    var sendKeyFunc = null;
    var sendPenFunc = null;
    var loadFileFunc = null;

    var statusElement = document.getElementById('status');
    var canvas = document.getElementById('canvas');
    var dropZone = document.getElementById('dropZone');
    var ctx = canvas.getContext('2d');
    var imageData = null;

    var Module = {
      preRun: [],
      postRun: [function() {
        initBindings();
        startRenderingLoop();
      }],
      print: function(text) {
        console.log('[MREmu WASM]: ' + text);
      },
      printErr: function(text) {
        console.error('[MREmu WASM Error]: ' + text);
      },
      canvas: canvas,
      setStatus: function(text) {
        statusElement.innerHTML = text;
      }
    };

    function initBindings() {
      if (typeof Module.cwrap === 'function') {
        sendKeyFunc = Module.cwrap('mremu_wasm_send_key_event', null, ['number', 'number']);
        sendPenFunc = Module.cwrap('mremu_wasm_send_pen_event', null, ['number', 'number', 'number']);
        loadFileFunc = Module.cwrap('mremu_wasm_load_file', 'number', ['string', 'number', 'number']);
      }
    }

    function sendKey(code, type) {
      if (sendKeyFunc) {
        sendKeyFunc(code, type);
      }
    }

    // Client-side File Loader
    function processSelectedFile(file) {
      if (!file) return;

      var validExts = ['.vxp', '.vre', '.mre'];
      var fileName = file.name.toLowerCase();
      var isValidExt = validExts.some(function(ext) { return fileName.endsWith(ext); });

      if (!isValidExt) {
        statusElement.style.color = '#f44336';
        statusElement.innerText = 'Error: Invalid file extension. Select a .vxp, .vre, or .mre file.';
        return;
      }

      var reader = new FileReader();
      reader.onload = function(e) {
        var arrayBuffer = e.target.result;
        var uint8Array = new Uint8Array(arrayBuffer);

        if (uint8Array.length < 4) {
          statusElement.style.color = '#f44336';
          statusElement.innerText = 'Error: File is empty or corrupt.';
          return;
        }

        // Validate Magic Bytes: Zlib header (0x78) or ELF header (0x7F 'E' 'L' 'F')
        var isZlib = uint8Array[0] === 0x78;
        var isElf = uint8Array[0] === 0x7F && uint8Array[1] === 0x45 && uint8Array[2] === 0x4C && uint8Array[3] === 0x46;

        if (!isZlib && !isElf) {
          statusElement.style.color = '#ff9800';
          statusElement.innerText = 'Warning: Unrecognized file magic bytes. Attempting launch...';
        } else {
          statusElement.style.color = '#4caf50';
          statusElement.innerText = 'Loaded file: ' + file.name + ' (' + uint8Array.length + ' bytes)';
        }

        // Pass memory into WASM heap
        var ptr = Module._malloc(uint8Array.length);
        Module.HEAPU8.set(uint8Array, ptr);

        if (loadFileFunc) {
          var res = loadFileFunc(file.name, ptr, uint8Array.length);
          if (res === 1) {
            statusElement.innerText = 'Successfully launched ' + file.name;
          } else {
            statusElement.style.color = '#f44336';
            statusElement.innerText = 'Failed to launch ' + file.name;
          }
        }

        Module._free(ptr);
      };

      reader.onerror = function() {
        statusElement.style.color = '#f44336';
        statusElement.innerText = 'Error reading file in browser.';
      };

      reader.readAsArrayBuffer(file);
    }

    function handleFileSelect(evt) {
      var files = evt.target.files;
      if (files && files.length > 0) {
        processSelectedFile(files[0]);
      }
    }

    // Drag and Drop Event Handlers
    dropZone.addEventListener('dragover', function(e) {
      e.preventDefault();
      dropZone.classList.add('hover');
    });

    dropZone.addEventListener('dragleave', function(e) {
      e.preventDefault();
      dropZone.classList.remove('hover');
    });

    dropZone.addEventListener('drop', function(e) {
      e.preventDefault();
      dropZone.classList.remove('hover');
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        processSelectedFile(e.dataTransfer.files[0]);
      }
    });

    // Configurable Keyboard Mappings
    var keyMap = {
      'ArrowUp': 1,
      'ArrowDown': 2,
      'ArrowLeft': 3,
      'ArrowRight': 4,
      'Enter': 5,
      'Space': 5,
      'Digit0': 48,
      'Digit1': 49,
      'Digit2': 50,
      'Digit3': 51,
      'Digit4': 52,
      'Digit5': 53,
      'Digit6': 54,
      'Digit7': 55,
      'Digit8': 56,
      'Digit9': 57,
      'KeyQ': 1001,
      'KeyE': 1002
    };

    window.addEventListener('keydown', function(e) {
      if (keyMap[e.code] !== undefined) {
        e.preventDefault();
        sendKey(keyMap[e.code], 0);
      }
    });

    window.addEventListener('keyup', function(e) {
      if (keyMap[e.code] !== undefined) {
        e.preventDefault();
        sendKey(keyMap[e.code], 1);
      }
    });

    // Gamepad API Polling
    var lastGamepadState = {};
    function pollGamepads() {
      var gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
      for (var i = 0; i < gamepads.length; i++) {
        var gp = gamepads[i];
        if (!gp) continue;

        checkGamepadButton(gp.id, 0, gp.buttons[0].pressed, 5);
        checkGamepadButton(gp.id, 12, gp.buttons[12]?.pressed, 1);
        checkGamepadButton(gp.id, 13, gp.buttons[13]?.pressed, 2);
        checkGamepadButton(gp.id, 14, gp.buttons[14]?.pressed, 3);
        checkGamepadButton(gp.id, 15, gp.buttons[15]?.pressed, 4);
        checkGamepadButton(gp.id, 4, gp.buttons[4]?.pressed, 1001);
        checkGamepadButton(gp.id, 5, gp.buttons[5]?.pressed, 1002);
      }
      requestAnimationFrame(pollGamepads);
    }

    function checkGamepadButton(gpId, btnIdx, isPressed, mreKey) {
      var keyState = gpId + '_' + btnIdx;
      var wasPressed = !!lastGamepadState[keyState];
      if (isPressed && !wasPressed) {
        sendKey(mreKey, 0);
        lastGamepadState[keyState] = true;
      } else if (!isPressed && wasPressed) {
        sendKey(mreKey, 1);
        lastGamepadState[keyState] = false;
      }
    }

    window.addEventListener("gamepadconnected", function(e) {
      statusElement.innerText = "Gamepad Connected: " + e.gamepad.id;
      pollGamepads();
    });

    window.addEventListener("gamepaddisconnected", function(e) {
      statusElement.innerText = "Gamepad Disconnected";
    });

    function startRenderingLoop() {
      statusElement.innerText = "Emulator Active";
      var getBuffer = Module.cwrap('mremu_wasm_get_screen_buffer', 'number', []);
      var getWidth = Module.cwrap('mremu_wasm_get_screen_width', 'number', []);
      var getHeight = Module.cwrap('mremu_wasm_get_screen_height', 'number', []);

      function renderFrame() {
        var width = getWidth() || 240;
        var height = getHeight() || 320;

        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
          imageData = null;
        }

        if (!imageData) {
          imageData = ctx.createImageData(width, height);
        }

        var bufPtr = getBuffer();
        if (bufPtr) {
          var numPixels = width * height;
          var heap16 = Module.HEAPU16;
          var startIdx = bufPtr >> 1;
          var data32 = new Uint32Array(imageData.data.buffer);

          for (var i = 0; i < numPixels; i++) {
            var rgb565 = heap16[startIdx + i];
            var r = ((rgb565 >> 11) & 0x1F) * 255 / 31;
            var g = ((rgb565 >> 5) & 0x3F) * 255 / 63;
            var b = (rgb565 & 0x1F) * 255 / 31;
            data32[i] = (0xFF << 24) | (b << 16) | (g << 8) | r;
          }

          ctx.putImageData(imageData, 0, 0);
        }

        requestAnimationFrame(renderFrame);
      }

      requestAnimationFrame(renderFrame);
    }
  </script>
  <script async src="mremu.js"></script>
</body>
</html>
